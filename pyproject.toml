[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-utils"
description = "Turn Python functions into a tool server with a dashboard, FastAPI-style."
readme = "README.md"
authors = [{ name = "Tanmay Dhote" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "watchdog>=4.0",
    "pillow>=10.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2", "ruff>=0.6"]
[project.scripts]
bu = "better_utils.cli:main"
better-utils = "better_utils.cli:main"

[tool.hatch.version]
path = "better_utils/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["better_utils"]
# bundle the (git-ignored, build-script-generated) dashboard into wheels
artifacts = ["better_utils/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["slow: boots a real subprocess server (uvicorn)"]
filterwarnings = ["error::RuntimeWarning:asyncio"]

[tool.ruff.lint]
# Broad excepts at user-code boundaries (schema fallback, watcher, cleanup)
# are deliberate: user modules can raise anything at import time.
ignore = ["BLE001", "B017"]
